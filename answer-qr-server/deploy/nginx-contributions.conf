# Optional: put inside the EXISTING HTTPS server, alongside the library location.
# Keep these prefixes exclusive to this application. Do not alter other locations.
# Define the dedicated limit zone once in nginx http {} before enabling:
# limit_req_zone $binary_remote_addr zone=answer_qr_submit:1m rate=10r/m;
# limit_req_zone $binary_remote_addr zone=answer_qr_poll:1m rate=5r/s;
# limit_req_zone $binary_remote_addr zone=answer_qr_login:1m rate=3r/m;

# Anonymous login entry points have their own low rate budget. Exact matches
# leave callback, confirmation, polling and submissions on their existing limits.
location = /answer-qr/auth/auto/start {
    proxy_pass http://127.0.0.1:8765/auth/auto/start;
    include /etc/nginx/snippets/answer-qr-auth-entry-proxy.conf;
}
location = /answer-qr/auth/login {
    proxy_pass http://127.0.0.1:8765/auth/login;
    include /etc/nginx/snippets/answer-qr-auth-entry-proxy.conf;
}

# Polling has a separate budget; it must not consume the login/submission limit.
location = /answer-qr/auth/auto/poll {
    proxy_pass http://127.0.0.1:8765/auth/auto/poll;
    include /etc/nginx/snippets/answer-qr-poll-proxy.conf;
}

location = /answer-qr/contributions {
    proxy_pass http://127.0.0.1:8765/contributions;
    include /etc/nginx/snippets/answer-qr-contribution-proxy.conf;
}
location ^~ /answer-qr/contributions/ {
    proxy_pass http://127.0.0.1:8765/contributions/;
    include /etc/nginx/snippets/answer-qr-contribution-proxy.conf;
}
location ^~ /answer-qr/auth/ {
    proxy_pass http://127.0.0.1:8765/auth/;
    include /etc/nginx/snippets/answer-qr-contribution-proxy.conf;
}
