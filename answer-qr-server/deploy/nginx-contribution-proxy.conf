# /etc/nginx/snippets/answer-qr-contribution-proxy.conf
# Only included by the optional contribution/auth locations.
proxy_set_header Host $host;
proxy_set_header Authorization $http_authorization;
proxy_set_header Origin $http_origin;
proxy_set_header Cookie $http_cookie;
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
proxy_cache off;
proxy_request_buffering on;
client_max_body_size 32m;
limit_req zone=answer_qr_submit burst=10 nodelay;
limit_req_status 429;
# Authorization codes arrive on the OAuth callback query. Never access-log it.
access_log off;
