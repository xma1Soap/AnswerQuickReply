# Paste only this location into the EXISTING HTTPS server block.
# Keep its existing listen/server_name/TLS and all other locations/services.
# Public client URL: https://YOUR_EXISTING_DOMAIN/answer-qr/library.json
# Python owns authentication and CORS; do not duplicate those headers here.
location = /answer-qr/library.json {
    proxy_pass http://127.0.0.1:8765/library.json;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Origin $http_origin;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_cache off;
    client_max_body_size 1k;
    # Do not log accidental query-string secrets for this one endpoint.
    access_log off;
}
