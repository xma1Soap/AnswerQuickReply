# Include once inside the EXISTING nginx http {} block. Do not duplicate zones
# already defined in that block; retain the current submission and polling values.
limit_req_zone $binary_remote_addr zone=answer_qr_submit:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=answer_qr_poll:1m rate=5r/s;
limit_req_zone $binary_remote_addr zone=answer_qr_login:1m rate=3r/m;
